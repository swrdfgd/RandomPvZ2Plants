<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Random Plants vs Zombies 2 Plant Picker</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#07111f;
    --panel:#10233a;
    --panel2:#16304f;
    --line:#2fe6ff;
    --text:#e9fdff;
    --muted:#83aab5;
    --glow:#38f5ff;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:'Orbitron',sans-serif;
    background:
        radial-gradient(circle at top,#17375f 0%,#08111d 45%,#05080d 100%);
    color:var(--text);
    overflow-x:hidden;
}

/* animated grid */

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:
        linear-gradient(rgba(47,230,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(47,230,255,0.05) 1px, transparent 1px);

    background-size:40px 40px;

    animation:gridMove 18s linear infinite;

    pointer-events:none;
}

@keyframes gridMove{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(40px);
    }
}

.container{
    width:min(1450px,95%);
    margin:auto;
    padding:30px 0 70px;
}

.hero{
    text-align:center;
    margin-bottom:28px;
}

.title{
    margin:0;
    font-size:clamp(2rem,5vw,4.5rem);
    font-weight:700;
    letter-spacing:2px;

    text-shadow:
        0 0 10px var(--glow),
        0 0 30px rgba(56,245,255,0.35);
}

.subtitle{
    margin-top:12px;
    color:var(--muted);
    font-size:1rem;
}

.panel{
    background:
        linear-gradient(
            180deg,
            var(--panel),
            var(--panel2)
        );

    border:1px solid rgba(47,230,255,0.22);

    border-radius:30px;

    padding:24px;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.35),
        0 0 15px rgba(56,245,255,0.08);
}

.controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
}

label{
    color:var(--muted);
    font-size:0.95rem;
}

input{
    width:90px;
    padding:14px;
    border-radius:18px;
    border:1px solid rgba(47,230,255,0.22);

    background:#091321;

    color:var(--text);

    font-family:inherit;
    font-size:1rem;

    outline:none;
    text-align:center;
}

input:focus{
    border-color:var(--line);

    box-shadow:
        0 0 12px rgba(47,230,255,0.3);
}

button{
    border:none;
    cursor:pointer;

    padding:14px 22px;

    border-radius:18px;

    background:#20e7ff;

    color:#041018;

    font-family:inherit;
    font-size:0.95rem;
    font-weight:700;

    transition:0.18s;

    box-shadow:
        0 0 16px rgba(32,231,255,0.35);
}

button:hover{
    transform:
        translateY(-3px)
        scale(1.03);

    box-shadow:
        0 0 24px rgba(32,231,255,0.55);
}

.stats{
    text-align:center;
    margin-top:18px;
    color:var(--muted);
    font-size:0.92rem;
}

.grid{
    margin-top:34px;

    display:grid;

    grid-template-columns:
        repeat(auto-fit,minmax(220px,1fr));

    gap:22px;
}

.card{
    position:relative;

    overflow:hidden;

    border-radius:28px;

    background:
        linear-gradient(
            180deg,
            rgba(17,35,56,0.96),
            rgba(9,18,32,0.96)
        );

    border:
        1px solid rgba(47,230,255,0.15);

    padding:22px;

    transition:0.22s;

    box-shadow:
        0 10px 24px rgba(0,0,0,0.35);
}

.card:hover{
    transform:
        translateY(-6px)
        scale(1.02);

    border-color:
        rgba(47,230,255,0.45);

    box-shadow:
        0 15px 36px rgba(0,0,0,0.45),
        0 0 18px rgba(47,230,255,0.16);
}

.card::before{
    content:"";
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            135deg,
            rgba(47,230,255,0.10),
            transparent 40%
        );

    pointer-events:none;
}

.image-wrap{
    height:170px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.card img{
    max-width:140px;
    max-height:140px;

    object-fit:contain;

    filter:
        drop-shadow(0 0 14px rgba(56,245,255,0.35));

    transition:0.2s;
}

.card:hover img{
    transform:scale(1.06);
}

.name{
    margin-top:18px;

    text-align:center;

    font-size:1rem;
    line-height:1.5;

    word-break:break-word;
}

@media(max-width:700px){

    .controls{
        flex-direction:column;
    }

    button{
        width:100%;
    }

    input{
        width:100%;
        max-width:180px;
    }

    .grid{
        grid-template-columns:
            repeat(auto-fit,minmax(160px,1fr));

        gap:16px;
    }

    .card{
        padding:18px;
    }

    .image-wrap{
        height:130px;
    }

    .card img{
        max-width:110px;
        max-height:110px;
    }

}

</style>
</head>

/*
=====================================
GENERATOR
=====================================
*/

const grid =
document.getElementById("grid");

const stats =
document.getElementById("stats");

stats.innerHTML =
`${plants.length} plants in database`;

function shuffle(array){

    for(
        let i=array.length-1;
        i>0;
        i--
    ){

        const j =
        Math.floor(
            Math.random()*(i+1)
        );

        [array[i],array[j]] =
        [array[j],array[i]];
    }

    return array;
}

function generatePlants(){

    if(plants.length===0)
        return;

    const count =
    parseInt(
        document.getElementById("count").value
    );

    const shuffled =
    shuffle([...plants]);

    const selected =
    shuffled.slice(
        0,
        Math.min(count,plants.length)
    );

    grid.innerHTML = "";

    selected.forEach(plant=>{

        const card =
        document.createElement("div");

        card.className = "card";

        card.innerHTML =
        `
        <div class="image-wrap">

            <img
                src="${plant.image}"
                alt="${plant.name}"
                loading="lazy"
            >

        </div>

        <div class="name">
            ${plant.name}
        </div>
        `;

        grid.appendChild(card);

    });

}

generatePlants();
